[package]
name = "oxide-app"
version = "0.1.1"
edition = "2024"
license = "MIT"

[dependencies]
arboard = { version = "3.6.1", default-features = false, features = ["image-data"] }
dirs = "7.0.0"
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "wgpu"] }
egui-phosphor = "0.14.0"
egui_commonmark = { version = "0.25.0", default-features = false, features = ["pulldown_cmark", "load-images"] }
egui_extras = { version = "0.36.0", default-features = false, features = ["image", "file"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "bmp", "tiff", "webp"] }
oxide-commands = { version = "0.1.0", path = "../oxide-commands" }
oxide-engine = { version = "0.1.0", path = "../oxide-engine" }
png = "0.18.1"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
tiff = "0.11.3"
toml = "1.1.8"

# Reading pen pressure/tilt/rotation straight from macOS (winit doesn't pass it on).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSEvent", "block2"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std"] }
block2 = "0.6"
muda = "0.21.2"

# Linux needs a window system: eframe's defaults are off above, so turn X11 and Wayland back on.
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["x11", "wayland"] }

# Windows: read the pen from WM_POINTER messages (winit turns it into a mouse).
[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Input_Pointer"] }

# Linux: tablet events over X11 (XInput2) and Wayland (tablet protocol).
[target.'cfg(target_os = "linux")'.dependencies.octotablet]
version = "0.1.0"
