[package]
name = "oxide-agent"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
oxide-commands = { version = "0.1.0", path = "../oxide-commands" }
rmcp = { version = "3.5.1", features = ["server", "transport-io", "macros"] }
schemars = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "io-std"] }
