name: Release

# Push a tag like v0.1.0 and this builds downloads for macOS, Windows and
# Linux and attaches them to a GitHub Release. The tag must match the version
# in crates/oxide-app/Cargo.toml.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.ref_name }}
  GH_TOKEN: ${{ github.token }}

jobs:
  create:
    name: Create the release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the app's version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/oxide-app/Cargo.toml | head -1)
          if [ "v$version" != "$TAG" ]; then
            echo "Tag $TAG doesn't match crates/oxide-app/Cargo.toml version $version" >&2
            exit 1
          fi
      - name: Create the release (a pre-release while the version starts with 0.)
        run: |
          flags=""
          case "$TAG" in v0.*) flags="--prerelease" ;; esac
          gh release create "$TAG" $flags --title "Oxide ${TAG#v}" --notes-file .github/release-notes.md --generate-notes \
            || echo "Release $TAG already exists; adding files to it."

  macos:
    name: macOS (Apple Silicon)
    needs: create
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # The help pages are the project's wiki; Help falls back to the online
      # wiki if this can't be fetched.
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build Oxide.app
        run: scripts/bundle-macos.sh
        env:
          CARGO: cargo
          OXIDE_WIKI: ${{ github.workspace }}/wiki
      - name: Zip and upload
        run: |
          name="Oxide-${TAG#v}-macos-arm64.zip"
          ditto -c -k --keepParent target/release/Oxide.app "$name"
          shasum -a 256 "$name" > "$name.sha256"
          gh release upload "$TAG" "$name" "$name.sha256" --clobber

  windows:
    name: Windows
    needs: create
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p oxide-app -p oxide-agent
      - name: Zip and upload
        run: |
          name="Oxide-${TAG#v}-windows-x64"
          mkdir "$name"
          cp target/release/oxide-app.exe target/release/oxide-mcp.exe target/release/oxide-run.exe LICENSE THIRD-PARTY-NOTICES.md README.md "$name/"
          7z a "$name.zip" "$name" > /dev/null
          sha256sum "$name.zip" > "$name.zip.sha256"
          gh release upload "$TAG" "$name.zip" "$name.zip.sha256" --clobber

  linux:
    name: Linux
    needs: create
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Linux libraries
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p oxide-app -p oxide-agent
      - name: Pack and upload
        run: |
          name="Oxide-${TAG#v}-linux-x64"
          mkdir "$name"
          cp target/release/oxide-app target/release/oxide-mcp target/release/oxide-run LICENSE THIRD-PARTY-NOTICES.md README.md "$name/"
          tar -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          gh release upload "$TAG" "$name.tar.gz" "$name.tar.gz.sha256" --clobber
